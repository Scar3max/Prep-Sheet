[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prepsheet"
version = "0.1.0"
description = "Prep Sheet: cafe demand prep planner with sell-out correction"
requires-python = ">=3.11"
authors = [{ name = "Prep Sheet" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
tabpfn = ["tabpfn-client", "pandas"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
